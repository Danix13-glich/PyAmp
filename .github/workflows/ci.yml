name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff + Black + MyPy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check src tests main.py

      - name: Black (format check)
        run: black --check src tests main.py

      - name: MyPy (type check)
        run: mypy

  test:
    name: Pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libs (Linux / libVLC)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev vlc-plugin-base libegl1 libgl1 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          pytest -q --tb=short > pytest.log 2>&1
          rc=$?
          tail -80 pytest.log
          if [ "$rc" -ne 0 ]; then
            if grep -qE "^(FAILED|ERROR) " pytest.log; then
              while IFS= read -r line; do
                echo "::error title=Pytest::$line"
              done < <(grep -E "^(FAILED|ERROR) " pytest.log | head -10)
            else
              while IFS= read -r line; do
                line=${line//'%'/'%25'}
                line=${line//$'\r'/}
                echo "::error title=Pytest log::$line"
              done < <(tail -8 pytest.log)
            fi
          fi
          exit "$rc"
